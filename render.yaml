# Render blueprint. Point Render at this repo and it builds both services.
#
#   https://dashboard.render.com/blueprints  ->  New Blueprint Instance
#
# Two values must be set by hand in the dashboard after the first deploy,
# because each depends on the other service's generated URL:
#
#   backend  PUBLIC_APP_URL      = the frontend's URL   (emergency QR codes
#                                  encode this; wrong value = dead QR)
#   frontend VITE_API_BASE_URL   = the backend's URL    (baked at build time,
#                                  so changing it needs a redeploy)
#
services:
  - type: web
    name: arogya-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false          # set in the dashboard; never commit a key
      - key: JWT_SECRET
        generateValue: true
      - key: DB_DOWNLOAD_URL
        sync: false          # GitHub Release asset holding arogya.db.gz
      - key: DB_PATH
        value: /app/arogya.db
      - key: PUBLIC_APP_URL
        sync: false          # the frontend URL, once Render has issued it
      - key: LLM_PROVIDER
        value: google
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-2.5-flash,gemini-3.5-flash-lite
      - key: OCR_PROVIDER
        value: auto
      - key: GEMINI_VISION_MODEL
        value: gemini-2.5-flash
      - key: OTP_DEV_MODE
        value: "true"        # demo logins accept 000000; turn OFF for real use
      - key: NOTIFICATION_PROVIDER
        value: mock
      - key: ENV
        value: production

  - type: web
    name: arogya-web
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false          # the backend URL, once Render has issued it
    routes:
      # React Router owns the paths. Without this, opening /doctor/login or a
      # scanned /emergency/<token> link directly returns 404 -- the QR code
      # would fail for exactly the person who needs it.
      - type: rewrite
        source: /*
        destination: /index.html
